# NV-09 T15 (1.3.0-u2): proxy local delante de la API efímera para RESTler.
# Igual que el ingress de Azure: declara HTTPS y una IP de cliente de prueba
# (TEST-NET-2, RFC 5737). La API solo confía en estos encabezados porque el
# proxy está en 127.0.0.1 (`Proxy__KnownProxies`).
worker_processes 1;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    access_log off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;

    server {
        listen 127.0.0.1:8081;

        location / {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host localhost;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For 198.51.100.20;
            proxy_read_timeout 60s;
        }
    }
}
