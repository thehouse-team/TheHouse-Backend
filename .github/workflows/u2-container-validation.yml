name: U2 Container Validation

on:
  workflow_dispatch:

  push:
    branches:
      - feature/u2-entrega
    paths:
      - Dockerfile
      - .dockerignore
      - TheHouse/**
      - TheHouse.Application/**
      - TheHouse.Domain/**
      - TheHouse.Infrastructure/**
      - .github/workflows/u2-container-validation.yml

permissions:
  contents: read

jobs:
  container-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: |
          docker build \
            --file Dockerfile \
            --tag thehouse-backend:u2-ci \
            .

      - name: Inspect configured container user
        run: |
          USER_NAME="$(docker image inspect \
            thehouse-backend:u2-ci \
            --format '{{.Config.User}}')"

          echo "Configured user: $USER_NAME"

          test "$USER_NAME" = "app"

      - name: Start container
        run: |
          docker run \
            --detach \
            --name thehouse-u2 \
            --publish 18080:8080 \
            thehouse-backend:u2-ci

      - name: Validate liveness endpoint
        run: |
          for attempt in $(seq 1 30); do
            if curl \
              --fail \
              --silent \
              --show-error \
              http://127.0.0.1:18080/health/live; then

              echo
              echo "Liveness healthy."
              exit 0
            fi

            sleep 1
          done

          docker logs thehouse-u2
          exit 1

      - name: Validate readiness endpoint
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            http://127.0.0.1:18080/health/ready

      - name: Show container diagnostics
        if: always()
        run: |
          docker ps -a
          docker inspect thehouse-u2 || true
          docker logs thehouse-u2 || true

      - name: Cleanup
        if: always()
        run: |
          docker rm --force thehouse-u2 || true
