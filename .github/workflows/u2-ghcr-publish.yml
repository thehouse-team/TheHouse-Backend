name: U2 GHCR Publish

on:
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: "Explicit publication confirmation"
        required: true
        type: choice
        default: "NO"
        options:
          - "NO"
          - "PUBLISH"

permissions:
  contents: read
  packages: write

concurrency:
  group: u2-ghcr-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish immutable GHCR image
    if: >-
      github.ref == 'refs/heads/feature/u2-entrega' &&
      inputs.confirm_publish == 'PUBLISH'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Prepare immutable image identity
        id: image
        shell: bash
        run: |
          set -euo pipefail

          OWNER="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER}/thehouse-backend"
          TAG="sha-${GITHUB_SHA}"

          echo "image=${IMAGE}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "reference=${IMAGE}:${TAG}" >> "${GITHUB_OUTPUT}"

          echo "Image: ${IMAGE}"
          echo "Tag:   ${TAG}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable image
        id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          pull: true
          tags: ${{ steps.image.outputs.reference }}
          labels: |
            org.opencontainers.image.title=TheHouse Backend
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.tag }}
          provenance: false
          sbom: false

      - name: Validate published digest
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          TAG: ${{ steps.image.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail

          if [ -z "${DIGEST}" ]; then
            echo "ERROR: build-push-action returned an empty digest."
            exit 1
          fi

          case "${DIGEST}" in
            sha256:*)
              ;;
            *)
              echo "ERROR: unexpected OCI digest: ${DIGEST}"
              exit 1
              ;;
          esac

          echo "Published image:"
          echo "${IMAGE}:${TAG}"
          echo
          echo "Immutable reference:"
          echo "${IMAGE}@${DIGEST}"

          docker buildx imagetools inspect \
            "${IMAGE}@${DIGEST}"

      - name: Write publication evidence
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          TAG: ${{ steps.image.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail

          {
            echo "## TheHouse U2 GHCR publication"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Repository | \`${GITHUB_REPOSITORY}\` |"
            echo "| Branch/ref | \`${GITHUB_REF}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Image | \`${IMAGE}\` |"
            echo "| Tag | \`${TAG}\` |"
            echo "| Digest | \`${DIGEST}\` |"
            echo "| Immutable ref | \`${IMAGE}@${DIGEST}\` |"
            echo "| Run ID | \`${GITHUB_RUN_ID}\` |"
          } >> "${GITHUB_STEP_SUMMARY}"
