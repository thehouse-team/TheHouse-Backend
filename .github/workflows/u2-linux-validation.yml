name: U2 Linux Validation

on:
  workflow_dispatch:

  push:
    branches:
      - feature/u2-entrega

permissions:
  contents: read

concurrency:
  group: u2-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and Test .NET 10
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      ASPNETCORE_ENVIRONMENT: Testing
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Show .NET environment
        run: dotnet --info

      - name: Restore
        run: dotnet restore TheHouse.slnx

      - name: Build
        run: >
          dotnet build TheHouse.slnx
          --configuration Release
          --no-restore
          --nologo

      - name: Run tests
        run: >
          dotnet test TheHouse.slnx
          --configuration Release
          --no-build
          --nologo
          --logger trx
          --results-directory "${{ github.workspace }}/TestResults"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: u2-test-results
          path: TestResults/
          if-no-files-found: warn
          retention-days: 7
