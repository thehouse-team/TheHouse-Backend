# TEMPORAL (NV-09 T09/T10): valida la verificación efímera en la rama de
# trabajo antes del merge, con una imagen local que no se publica.
# Se elimina antes de abrir el pull request.
name: NV-09 ephemeral check (temporal)

on:
  push:
    branches:
      - feat/nv-09-cd

permissions:
  contents: read

concurrency:
  group: nv09-ephemeral-${{ github.ref }}
  cancel-in-progress: true

env:
  ZAP_IMAGE: "ghcr.io/zaproxy/zaproxy:2.17.0"

jobs:
  verify-ephemeral:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mongo:
        image: mongo:8.0.34
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4.12
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      REF: thehouse-backend:ephemeral
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build local (sin publicar)
        run: docker build --file Dockerfile --tag "$REF" .

      - name: Llave JWT efímera
        shell: bash
        run: |
          set -euo pipefail
          key="$(openssl rand -base64 48 | tr -d '\n')"
          echo "::add-mask::$key"
          echo "Jwt__SigningKey=$key" >> "$GITHUB_ENV"

      - name: Seed de catálogo (Testing)
        run: bash .github/scripts/ephemeral_env.sh seed "$REF"

      - name: Levantar API efímera
        run: bash .github/scripts/ephemeral_env.sh start "$REF" smoke

      - name: Smoke tests completos
        run: python3 .github/scripts/smoke_test.py --base-url http://127.0.0.1:8080 --mode full --report smoke-ephemeral.md --ready-attempts 10 --ready-delay 2

      - name: Reiniciar API para el escaneo activo
        run: bash .github/scripts/ephemeral_env.sh start "$REF" scan

      - name: ZAP API scan
        shell: bash
        run: |
          set +e
          mkdir -p zap && cp .zap/rules.tsv zap/ && chmod -R 777 zap
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" "$ZAP_IMAGE" \
            zap-api-scan.py -t http://127.0.0.1:8080/openapi/v1.json -f openapi \
            -c rules.tsv -J zap-api.json -r zap-api.html -I
          code=$?
          if [ "$code" -ge 3 ]; then
            echo "::error::ZAP no pudo completar el escaneo (código $code)."
            exit 1
          fi
          python3 .github/scripts/zap_gate.py zap/zap-api.json "ZAP API scan (entorno efímero)"

      - name: Logs de la API ante fallo
        if: failure()
        run: bash .github/scripts/ephemeral_env.sh logs

      - name: Detener API
        if: always()
        run: bash .github/scripts/ephemeral_env.sh stop

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: verify-ephemeral
          path: |
            smoke-ephemeral.md
            zap/zap-api.json
            zap/zap-api.html
          retention-days: 14
          if-no-files-found: warn
